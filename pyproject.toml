[project]
name = "cf-analyser"
version = "0.1.0"
description = "Local MCP server for analysing Codeforces activity, recommending problems, and comparing users"
readme = "README.md"
authors = [
    { name = "aditya nath", email = "adityanath5002@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.1.1",
]

[project.scripts]
cf-analyser = "cf_analyser:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
